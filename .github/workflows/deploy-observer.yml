name: Deployment observer

on:
  workflow_run:
    workflows: ["CD · GitHub Pages"]
    types: [completed]

permissions:
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment workflow result
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "${CONCLUSION}" = "success" ]; then
            STATE=success
            DESCRIPTION="GitHub Pages workflow completed successfully"
          else
            STATE=failure
            DESCRIPTION="GitHub Pages workflow failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -f state="${STATE}" -f context=mission-dev/pages-workflow -f description="${DESCRIPTION}" -f target_url="${RUN_URL}"

name: CD · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Quality gate and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality gate
        run: npm run quality

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy and verify production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live application
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import re
          import time
          import urllib.parse
          import urllib.request

          page_url = os.environ["PAGE_URL"]
          html = ""
          last_error = None
          headers = {"User-Agent": "mission-dev-deploy-check"}

          for attempt in range(18):
              try:
                  request = urllib.request.Request(page_url, headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      html = response.read().decode("utf-8")
                  if "<title>Mission Dev</title>" in html and 'id="root"' in html:
                      break
              except Exception as error:
                  last_error = error
              time.sleep(10)
          else:
              raise RuntimeError(f"Live page did not become healthy. Last error: {last_error}")

          assets = re.findall(r'(?:src|href)="([^"]+\.(?:js|css))"', html)
          if not assets:
              raise RuntimeError("No JavaScript or CSS production assets were referenced by the live page.")

          for asset in assets:
              asset_url = urllib.parse.urljoin(page_url, asset)
              request = urllib.request.Request(asset_url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"Asset failed with HTTP {response.status}: {asset_url}")

          satellite_assets = [f"satellites/sat-{index}.webp" for index in range(1, 4)]
          for asset in satellite_assets:
              asset_url = urllib.parse.urljoin(page_url, asset)
              request = urllib.request.Request(asset_url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = response.read()
                  content_type = response.headers.get("Content-Type", "")
                  if response.status != 200:
                      raise RuntimeError(f"Satellite artwork failed with HTTP {response.status}: {asset_url}")
              if len(payload) < 1000 or not payload.startswith(b"RIFF") or payload[8:12] != b"WEBP":
                  raise RuntimeError(f"Satellite artwork is not a valid WebP asset: {asset_url}")
              if "image/webp" not in content_type.lower():
                  raise RuntimeError(f"Satellite artwork has unexpected content type {content_type}: {asset_url}")

          print(f"Verified live page, {len(assets)} production assets and {len(satellite_assets)} user-provided satellite views at {page_url}")
          PY

      - name: Publish verified deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=mission-dev/pages-live -f description="GitHub Pages deployed and live assets verified" -f target_url="${PAGE_URL}"

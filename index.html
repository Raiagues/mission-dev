:root{--bg:#06182b;--deep:#04111e;--line:rgba(150,204,255,.28);--line2:rgba(150,204,255,.5);--text:#eef6ff;--muted:#8fa5bb;--blue:#73b5ff;--green:#35d3a2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--deep)}button,a{font:inherit;color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr;background:linear-gradient(rgba(92,151,208,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(92,151,208,.05) 1px,transparent 1px),linear-gradient(180deg,#06182b,#071a2d);background-size:28px 28px,28px 28px,auto}.sidebar{border-right:1px solid var(--line);background:rgba(3,17,30,.97);display:flex;flex-direction:column;z-index:30}.brand{height:90px;display:flex;align-items:center;gap:14px;padding:0 25px;border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.08em}.brandmark{width:29px;height:29px;border:1px solid var(--line2);transform:rotate(45deg);position:relative}.brandmark:before,.brandmark:after{content:"";position:absolute;background:var(--line2)}.brandmark:before{width:1px;height:39px;left:13px;top:-6px}.brandmark:after{height:1px;width:39px;left:-6px;top:13px}.nav{padding:16px 9px;display:grid;gap:8px}.nav button{height:61px;border:0;border-left:3px solid transparent;background:transparent;display:flex;align-items:center;gap:16px;padding:0 22px;text-align:left;cursor:pointer}.nav button.active{border-left-color:var(--blue);background:rgba(62,132,204,.15);color:#a8d0ff}.nav button:hover{background:rgba(62,132,204,.08)}.ni{width:25px;text-align:center;font-size:25px;color:#9ccaff}.sideuser{margin-top:auto;border-top:1px solid var(--line);padding:18px 20px;display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border:1px solid var(--blue);border-radius:50%;display:grid;place-items:center;color:#a8d0ff}.uname{font-size:14px}.state{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}.dot{width:7px; nter}.card:hover{background:rgba(22,53,82,.35);border-color:#7bbaff}.card.disabled{cursor:not-allowed}.card strong{font-size:17px;font-weight:450}.card small{font-size:13px;line-height:1.45;color:#aec0d0}.ci{width:60px;height:60px;display:grid;place-items:center;color:#8dc3ff;font-size:51px}.plus{border:2px solid #79b9ff;border-radius:50%;font-size:41px}.dev{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 5px}.modal{position:fixed;inset:0;background:rgba(1,8,14,.76);display:none;place-items:center;z-index:100;padding:18px}.modal.show{display:grid}.panel{position:relative;width:min(740px,100%);background:#071b2f;border:1px solid var(--line2);padding:27px}.x{position:absolute;right:13px;top:9px;border:0;background:transparent;font-size:28px;color:var(--muted);cursor:pointer}.ey{font-size:11px;color:var(--blue);letter-spacing:.17em}.panel h2{font-size:23px;font-weight:400}.opts{display:grid;gap:11px}.opt{min-height:105px;border:1px solid var(--line2);background:rgba(7,29,50,.65);display:grid;grid-template-columns:45px 1fr auto;gap:12px;align-items:center;padding:16px;text-decoration:none;text-align:left}.opt.enabled:hover{border-color:var(--blue);background:rgba(29,70,109,.4)}.opt.disabled{cursor:not-allowed}.opt strong{display:block;font-size:15px}.opt small{display:block;color:var(--muted);margin-top:5px}.num{color:var(--blue)}.toast{position:fixed;right:20px;bottom:20px;z-index:120;display:none;width:min(360px,calc(100vw - 24px));border:1px solid var(--line2);background:#071b2f;padding:13px}.toast.show{display:block}.toast strong{display:block;font-size:13px}.toast span{font-size:12px;color:var(--muted)}.overlay{display:none}

<script>
const D={pt:{home:'Início',create:'Criar projeto',open:'Abrir projeto',import:'Importar requisitos',docs:'Documentação',connected:'Conectado',subtitle:'SOFTWARE PARA MISSÕES ESPACIAIS',createDesc:'Comece uma nova missão.',openDesc:'Acesse e continue um projeto existente.',importDesc:'Importe requisitos de arquivos externos.',viewDocs:'Ver documentação',docsDesc:'Acesse guias e referências da aplicação.',dev:'Em desenvolvimento',createMission:'CRIAR MISSÃO',how:'Como você quer começar?',mind:'Já tenho uma missão em mente',mindDesc:'Informar uma missão já estruturada.',zero:'Construir uma missão do zero',zeroDesc:'Começar pela concepção do problema e desenvolver a missão.',notice:'Esta função ainda está em desenvolvimento.'},en:{home:'Home',create:'Create project',open:'Open project',import:'Import requirements',docs:'Documentation',connected:'Connected',subtitle:'SOFTWARE FOR SPACE MISSIONS',createDesc:'Start a new mission.',openDesc:'Access and continue an existing project.',importDesc:'Import requirements from external files.',viewDocs:'View documentation',docsDesc:'Access application guides and references.',dev:'In development',createMission:'CREATE MISSION',how:'How do you want to start?',mind:'I already have a mission in mind',mindDesc:'Enter a mission that is already structured.',zero:'Build a mission from scratch',zeroDesc:'Start from problem conception and develop the mission.',notice:'This feature is still in development.'}};let L=localStorage.getItem('missionDevLang')||'pt',v=0,timer,to;const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);function tr(k){return D[L][k]||k}function lang(){document.documentElement.lang=L==='pt'?'pt-BR':'en';$$('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));$$('.lang').forEach(e=>e.classList.toggle('active',e.dataset.lang===L));localStorage.setItem('missionDevLang',L)}function view(n){v=n;$$('.view').forEach((e,i)=>e.classList.toggle('active',i===n));$$('.vd').forEach((e,i)=>e.classList.toggle('active',i===n))}function rotate(){clearInterval(timer);timer=setInterval(()=>view((v+1)%2),5200)}function toast(k){$('#toastTitle').textContent=tr(k);$('#toast').classList.add('show');clearTimeout(to);to=setTimeout(()=>$('#toast').classList.remove('show'),2500)}$$('.lang').forEach(b=>b.onclick=()=>{L=b.dataset.lang;lang()});$$('[data-create]').forEach(b=>b.onclick=()=>$('#modal').classList.add('show'));$$('[data-dev]').forEach(b=>b.onclick=e=>{e.preventDefault();toast(b.dataset.dev)});$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};$('#menu').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('show')};$('#overlay').onclick=()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')};$$('.vd').forEach(b=>b.onclick=()=>{view(+b.dataset.v);rotate()});lang();rotate();

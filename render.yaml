services:
  - type: web
    name: norte-missao
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: VITE_BASE_PATH
        value: /
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
